[project]
name = "bug0-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg2-binary>=2.9",
  "pydantic-settings>=2.3",
  "redis>=5.0",
  "celery>=5.4",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  "httpx>=0.27",
  "boto3>=1.34",
  "anthropic>=0.40",
  "openai>=1.40",
  "browser-use>=0.1",
  "stripe>=9.0",
  "sendgrid>=6.11",
  "python-multipart>=0.0.9",
  "loguru>=0.7",
  "sentry-sdk[fastapi]>=2.0",
  "slowapi>=0.1",
  "pgvector>=0.3",
  "pixelmatch>=0.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
