version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bug0
      POSTGRES_PASSWORD: bug0pass
      POSTGRES_DB: bug0db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bug0minio
      MINIO_ROOT_PASSWORD: bug0miniopass
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build: ../backend
    env_file: ../.env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - minio
    volumes:
      - ../backend:/app

  runner:
    build: ../runner
    env_file: ../.env
    depends_on:
      - redis
      - backend
    volumes:
      - ../runner:/app

  frontend:
    build: ../frontend
    ports:
      - "3000:3000"
    env_file: ../.env
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  minio_data:
